<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Guia do Mercado">
  <!-- Carrinho levando bloco de notas, lápis e dinheiro: planejar a compra é organização, agilidade e economia -->
  <g stroke="#161925" stroke-width="2.5" stroke-linejoin="round">
    <!-- cédula -->
    <g transform="rotate(12 48 21)">
      <rect x="35.5" y="12" width="25" height="16" rx="2" fill="#235789" />
      <circle cx="48" cy="19.5" r="3.6" fill="none" stroke="#FDFFFC" stroke-width="2" />
      <path d="M39.5 16v0M56.5 16v0" stroke="#FDFFFC" stroke-width="2.6" stroke-linecap="round" />
    </g>
    <!-- bloco de notas -->
    <g transform="rotate(-8 23 19)">
      <rect x="12" y="5" width="22" height="28" rx="2.5" fill="#FDFFFC" />
      <path d="M16.5 12.5h12M16.5 17.5h12M16.5 22.5h7" fill="none" stroke-linecap="round" stroke-width="2.2" />
    </g>
    <!-- lápis sobre o bloco, ponta para cima -->
    <g transform="rotate(38 31 17)">
      <rect x="28" y="9" width="6" height="21" fill="#F1D302" />
      <path d="M28 9l3-6.5 3 6.5z" fill="#FDFFFC" />
      <path d="M30.1 4.4l.9-1.9.9 1.9z" fill="#161925" stroke-width="1.2" />
    </g>
  </g>
  <!-- carrinho -->
  <path d="M3 13h6.5l3.6 16" fill="none" stroke="#161925" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M11 29h50l-5.5 19H16.5z" fill="#161925" stroke="#161925" stroke-width="4" stroke-linejoin="round" />
  <path d="M24 34v9M32 34v9M40 34v9" stroke="#FDFFFC" stroke-width="2.6" stroke-linecap="round" opacity=".9" />
  <path d="M16.5 48l1.5 5h35" fill="none" stroke="#161925" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="22" cy="58" r="4" fill="#161925" />
  <circle cx="49" cy="58" r="4" fill="#161925" />
  <!-- moeda -->
  <circle cx="51" cy="38" r="7.5" fill="#F1D302" stroke="#161925" stroke-width="2.5" />
  <path d="M53.4 34.9c-.6-.8-1.5-1.2-2.6-1.2-1.5 0-2.6.8-2.6 2 0 2.7 5.4 1.6 5.4 4.4 0 1.2-1.2 2.1-2.8 2.1-1.2 0-2.2-.5-2.8-1.3M50.9 32.4v11.2" fill="none" stroke="#161925" stroke-width="1.8" stroke-linecap="round" />
</svg>
